<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> BUYBLOOM | ADMIN TICKETS </title>
    <link
      rel="icon"
      href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo"
      type="image/gif"
      sizes="16x16"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:400,700&display=swap"
      rel="stylesheet"
    />
    <script src="src/assets/js/jQuery3.4.1.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Lato", sans-serif;
        background-color: #f4f6f9;
        display: flex;
        flex-direction: column;
      }

      #header-container {
        width: 100%;
      }

      #dashboard-wrapper {
        display: flex;
        flex: 1;
        min-height: calc(100vh - 120px);
      }

      /* Sidebar Layout Configuration */
      .sidebar {
        width: 240px;
        background-color: #2c3e50;
        color: #fff;
        padding-top: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .sidebar-menu {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      .sidebar h3 {
        text-align: center;
        font-size: 18px;
        margin-bottom: 30px;
        letter-spacing: 1px;
        color: #ecf0f1;
      }
      .sidebar a {
        display: flex;
        align-items: center;
        padding: 15px 25px;
        color: #bdc3c7;
        text-decoration: none;
        transition: all 0.3s ease;
        font-size: 15px;
        cursor: pointer;
      }
      .sidebar a i {
        margin-right: 15px;
        width: 20px;
        text-align: center;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background-color: #34495e;
        color: #fff;
        border-left: 4px solid #3498db;
      }
      .sidebar a.disabled-link {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .sidebar a.disabled-link:hover {
        background-color: transparent;
        color: #bdc3c7;
        border-left: none;
      }
      .sidebar a.logout-btn {
        color: #e74c3c;
        border-top: 1px solid #34495e;
        margin-top: auto;
        padding: 20px 25px;
        font-weight: bold;
      }
      .sidebar a.logout-btn:hover {
        background-color: #c0392b;
        color: #fff;
        border-left: 4px solid #fff;
      }

      /* Main Workspace Container */
      .main-content {
        flex: 1;
        padding: 30px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .page-title {
        margin: 0 0 25px 0;
        color: #333;
      }

      /* Ticket Cards Presentation Grid */
      .tickets-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .ticket-card {
        background: #fff;
        border-radius: 8px;
        padding: 25px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        border-left: 5px solid #3498db;
      }
      .ticket-card.answered {
        border-left-color: #2ecc71;
      }
      .ticket-header {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #edf2f7;
        padding-bottom: 12px;
        margin-bottom: 15px;
      }
      .ticket-id {
        font-weight: bold;
        color: #2c3e50;
        font-size: 16px;
      }
      .ticket-date {
        color: #7f8c8d;
        font-size: 13px;
      }

      .user-meta-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
        background: #f8f9fa;
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 15px;
        font-size: 14px;
      }
      .meta-label {
        font-weight: bold;
        color: #555;
      }

      .issue-text {
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 15px;
        color: #333;
      }

      /* Image proof management container */
      .attached-proof-box {
        margin: 15px 0;
      }
      .attached-proof-box img {
        max-width: 180px;
        border-radius: 4px;
        border: 1px solid #ddd;
        cursor: zoom-in;
        transition: transform 0.2s;
      }
      .attached-proof-box img:hover {
        transform: scale(1.03);
      }

      /* Admin Action Reply Forms */
      .reply-section {
        background: #fcfcfc;
        border-top: 1px dashed #e2e8f0;
        padding-top: 15px;
        margin-top: 15px;
      }
      .reply-textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        font-family: inherit;
        resize: vertical;
        box-sizing: border-box;
        margin-bottom: 10px;
      }
      .btn-send-reply {
        background: #2ecc71;
        color: #fff;
        border: none;
        padding: 8px 20px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-send-reply:hover {
        background: #27ae60;
      }
      .btn-send-reply:disabled {
        background: #95a5a6;
        cursor: not-allowed;
      }
      .already-replied-msg {
        background: #e8f8f5;
        color: #27ae60;
        padding: 12px;
        border-radius: 4px;
        font-style: italic;
        border-left: 3px solid #2ecc71;
      }

      .no-tickets-msg {
        text-align: center;
        padding: 60px;
        background: #fff;
        border-radius: 6px;
        color: #95a5a6;
        font-style: italic;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
    </style>
    <script>
      function loadComponent(url, elementId) {
        var req = new XMLHttpRequest();
        req.open("GET", url, false);
        req.send(null);
        document.getElementById(elementId).innerHTML = req.responseText;
      }
    </script>
  </head>
  <body>
    <div id="header-container"></div>
    <script>
      loadComponent("header.html", "header-container");
    </script>

    <div id="dashboard-wrapper">
      <aside class="sidebar">
        <div class="sidebar-menu">
          <h3>ADMIN PANEL</h3>
          <a href="exadmidashbord.html"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="adclothing.html"
            ><i class="fas fa-tshirt"></i> Clothing</a
          >
          <a href="adaccessories.html"
            ><i class="fas fa-gem"></i> Accessories</a
          >
          <a href="order.html"><i class="fas fa-shopping-basket"></i> Orders</a>
          <a href="supportstricket.html" class="active"
            ><i class="fas fa-headset"></i> Support Tickets</a
          >
          <a href="exadmidashbord.html"
            ><i class="fas fa-users"></i> Users</a
          >
        </div>
        <a onclick="handleLogout()" class="logout-btn"
          ><i class="fas fa-sign-out-alt"></i> Log Out</a
        >
      </aside>

      <main class="main-content">
        <h2 class="page-title">User Support & Claim Tickets</h2>
        <div id="tickets-list-wrapper" class="tickets-container">
          <p style="text-align: center; color: #95a5a6">Loading tickets...</p>
        </div>
      </main>
    </div>

    <div id="footer-container"></div>
    <script>
      loadComponent("footer.html", "footer-container");
    </script>

    <script>
      const API_BASE = "http://localhost:5000/api"; // update to your deployed backend URL
      const UPLOADS_BASE = "http://localhost:5000"; // backend origin, for serving /uploads images
      const token = localStorage.getItem("buybloom_token"); // JWT auth token only, not app data

      if (!token) {
        window.location.href = "login.html";
      }

      let currentTickets = []; // cache fetched tickets for re-rendering after a reply

      async function loadUserTickets() {
        const wrapper = document.getElementById("tickets-list-wrapper");

        try {
          const res = await fetch(`${API_BASE}/tickets`, {
            headers: {Authorization: `Bearer ${token}`},
          });
          const data = await res.json();

          if (!data.success)
            throw new Error(data.message || "Failed to load tickets");

          currentTickets = data.tickets;
          renderTickets();
        } catch (err) {
          console.error("Failed to load tickets:", err);
          wrapper.innerHTML = `<div class="no-tickets-msg"><i class="fas fa-exclamation-triangle" style="font-size:32px; display:block; margin-bottom:10px;"></i>Could not load tickets. ${err.message || ""}</div>`;
        }
      }

      function renderTickets() {
        const wrapper = document.getElementById("tickets-list-wrapper");

        if (currentTickets.length === 0) {
          wrapper.innerHTML = `<div class="no-tickets-msg"><i class="fas fa-folder-open" style="font-size:32px; display:block; margin-bottom:10px;"></i>No customer support tickets received yet.</div>`;
          return;
        }

        wrapper.innerHTML = "";

        currentTickets.forEach((tkt) => {
          const card = document.createElement("div");
          card.className = `ticket-card ${tkt.adminReply ? "answered" : ""}`;

          const ticketDisplayId = "#" + tkt._id.slice(-8).toUpperCase();
          const ticketDate = new Date(tkt.createdAt).toLocaleString();
          const imageUrl = tkt.image ? `${UPLOADS_BASE}${tkt.image}` : "";

          card.innerHTML = `
                    <div class="ticket-header">
                        <span class="ticket-id"><i class="fas fa-ticket-alt"></i> ${ticketDisplayId}</span>
                        <span class="ticket-date">${ticketDate}</span>
                    </div>
                    
                    <div class="user-meta-info">
                        <div><span class="meta-label">Customer:</span> ${tkt.name}</div>
                        <div><span class="meta-label">Phone:</span> ${tkt.phone}</div>
                        <div><span class="meta-label">Email:</span> ${tkt.email}</div>
                        <div><span class="meta-label">Address:</span> ${tkt.address}</div>
                    </div>

                    <div class="issue-text">
                        <strong>Description of Issue:</strong><br>
                        ${tkt.message}
                    </div>

                    ${
                      imageUrl
                        ? `
                        <div class="attached-proof-box">
                            <strong><i class="fas fa-image"></i> Uploaded Photo Proof:</strong><br>
                            <img src="${imageUrl}" alt="User proof element" onclick="window.open(this.src)">
                        </div>
                    `
                        : ""
                    }

                    <div class="reply-section">
                        ${
                          tkt.adminReply
                            ? `
                            <div class="already-replied-msg">
                                <strong><i class="fas fa-check-circle"></i> Sent Response:</strong> ${tkt.adminReply}
                            </div>
                        `
                            : `
                            <textarea id="reply-box-${tkt._id}" class="reply-textarea" rows="2" placeholder="Write standard response solution for this user inquiry..."></textarea>
                            <button class="btn-send-reply" onclick="submitAdminReply('${tkt._id}', this)">Send Official Reply</button>
                        `
                        }
                    </div>
                `;
          wrapper.appendChild(card);
        });
      }

      async function submitAdminReply(ticketId, buttonEl) {
        const textarea = document.getElementById(`reply-box-${ticketId}`);
        const replyText = textarea.value.trim();

        if (replyText === "") {
          alert("Please type a response before submitting!");
          return;
        }

        buttonEl.disabled = true;
        buttonEl.textContent = "Sending...";

        try {
          const res = await fetch(`${API_BASE}/tickets/${ticketId}/reply`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({adminReply: replyText}),
          });
          const data = await res.json();

          if (!data.success) throw new Error(data.message);

          alert(
            "Reply posted successfully! The user will see this on their channel dashboard immediately.",
          );

          // Update local cache and re-render instead of a full refetch
          const idx = currentTickets.findIndex((t) => t._id === ticketId);
          if (idx !== -1) currentTickets[idx] = data.ticket;
          renderTickets();
        } catch (err) {
          console.error("Failed to send reply:", err);
          alert(err.message || "Failed to send reply.");
          buttonEl.disabled = false;
          buttonEl.textContent = "Send Official Reply";
        }
      }

      function handleLogout() {
        if (confirm("Logout from the Admin Panel?")) {
          localStorage.removeItem("buybloom_token");
          window.location.href = "login.html";
        }
      }

      window.onload = function () {
        loadUserTickets();
      };
    </script>
  </body>
</html>
