<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> BUYBLOOM | ADMIN DASHBOARD </title>
    <link
      rel="icon"
      href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo"
      type="image/gif"
      sizes="16x16"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato&display=swap"
      rel="stylesheet"
    />
    <link

    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Lato", sans-serif;
        background-color: #f4f6f9;
        display: flex;
        flex-direction: column;
      }

      #header-container {
        width: 100%;
      }

      #dashboard-wrapper {
        display: flex;
        flex: 1;
        min-height: calc(100vh - 120px);
      }

      /* Sidebar Styling */
      .sidebar {
        width: 240px;
        background-color: #2c3e50;
        color: #fff;
        padding-top: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .sidebar-menu {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      .sidebar h3 {
        text-align: center;
        font-size: 18px;
        margin-bottom: 30px;
        letter-spacing: 1px;
        color: #ecf0f1;
      }
      .sidebar a {
        display: flex;
        align-items: center;
        padding: 15px 25px;
        color: #bdc3c7;
        text-decoration: none;
        transition: all 0.3s ease;
        font-size: 15px;
        cursor: pointer;
      }
      .sidebar a i {
        margin-right: 15px;
        width: 20px;
        text-align: center;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background-color: #34495e;
        color: #fff;
        border-left: 4px solid #3498db;
      }
      .sidebar a.disabled-link {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .sidebar a.disabled-link:hover {
        background-color: transparent;
        color: #bdc3c7;
        border-left: none;
      }
      .sidebar a.logout-btn {
        color: #e74c3c;
        border-top: 1px solid #34495e;
        margin-top: auto;
        padding: 20px 25px;
        font-weight: bold;
      }
      .sidebar a.logout-btn:hover {
        background-color: #c0392b;
        color: #fff;
        border-left: 4px solid #fff;
      }

      /* Main Content Panel */
      .main-content {
        flex: 1;
        padding: 30px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .page-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }
      .page-title {
        margin: 0;
        color: #333;
      }

      /* Timeframe Filter Buttons */
      .timeframe-filters {
        display: flex;
        gap: 10px;
      }
      .filter-btn {
        background: #fff;
        border: 1px solid #ccc;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-family: "Lato", sans-serif;
        font-weight: bold;
        font-size: 13px;
        color: #7f8c8d;
        transition: all 0.2s;
      }
      .filter-btn.active {
        background: #3498db;
        color: #fff;
        border-color: #3498db;
      }
      .filter-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Summary Cards Grid */
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 35px;
      }
      .card {
        background: #fff;
        padding: 20px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card-info h4 {
        margin: 0;
        color: #7f8c8d;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .card-info p {
        margin: 5px 0 0 0;
        font-size: 24px;
        font-weight: bold;
        color: #2c3e50;
      }
      .card-icon {
        font-size: 28px;
        color: #95a5a6;
      }

      /* Chart Layout Grids */
      .charts-container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 25px;
      }
      .chart-card {
        background: #fff;
        border-radius: 6px;
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        box-sizing: border-box;
      }
      .chart-card h3 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 16px;
        color: #2c3e50;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }
      .chart-wrapper {
        position: relative;
        width: 100%;
        height: 300px;
      }

      #footer-container {
        width: 100%;
      }

      /* Error banner for failed API calls */
      #dashboard-error {
        display: none;
        background: #fdecea;
        border: 1px solid #f5c6cb;
        color: #c0392b;
        padding: 12px 18px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 14px;
      }
    </style>
    <script>
      function loadComponent(url, elementId) {
        var req = new XMLHttpRequest();
        req.open("GET", url, false);
        req.send(null);
        document.getElementById(elementId).innerHTML = req.responseText;
      }
    </script>

    <script>
      loadComponent("header.html", "header-container");
    </script>

    <div id="dashboard-wrapper">
      <aside class="sidebar">
        <div class="sidebar-menu">

          <a href="exadmidashbord.html"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="adclothing.html"><i class="fas fa-tshirt"></i> Clothing</a>
          <a href="adaccessories.html"
            ><i class="fas fa-gem"></i> Accessories</a
          >
          <a href="order.html"><i class="fas fa-shopping-basket"></i> Orders</a>
          <a href="supportstricket.html"
            ><i class="fas fa-headset"></i> Support Tickets</a
          >
          <a href="exadmidashbord.html"
            ><i class="fas fa-users"></i> Users</a
          >
        </div>
        <a onclick="handleLogout()" class="logout-btn"
          ><i class="fas fa-sign-out-alt"></i> Log Out</a
        >
      </aside>

      <main class="main-content">
        <div class="page-title-row">
          <h2 class="page-title">System Activity Overview</h2>
          <div class="timeframe-filters">
            <button
              id="btn-daily"
              class="filter-btn active"

            >
            <button
              id="btn-weekly"

              onclick="updateTimeframe('weekly')"

            >
            <button
              id="btn-monthly"
              class="filter-btn"
              onclick="updateTimeframe('monthly')"
              >Monthly</button
            >
          </div>
        </div>

        <div id="dashboard-error"></div>

        <div class="metrics-grid">
          <div class="card">
            <div class="card-info"
              ><h4>Total Users</h4><p id="txt-total-users">…</p></div
            >
            <i class="fas fa-users card-icon" style="color: #3498db"></i>
          </div>
          <div class="card">
            <div class="card-info"
              ><h4>Active Users</h4><p id="txt-active-users">…</p></div
            >
            <i class="fas fa-user-check card-icon" style="color: #2ecc71"></i>
          </div>
          <div class="card">
            <div class="card-info"
              ><h4>Total Orders</h4><p id="txt-total-orders">…</p></div
            >
            <i class="fas fa-shopping-bag card-icon" style="color: #f1c40f"></i>
          </div>
          <div class="card">
            <div class="card-info"
              ><h4>Revenue</h4><p id="txt-revenue">…</p></div
            >
            <i class="fas fa-dollar-sign card-icon" style="color: #27ae60"></i>
          </div>
          <div class="card">
            <div class="card-info"
              ><h4>Pending Orders</h4><p id="txt-pending">…</p></div
            >
            <i class="fas fa-clock card-icon" style="color: #e74c3c"></i>
          </div>
        </div>

        <div class="charts-container">
          <div class="chart-card">
            <h3>User Growth Analytics</h3>
            <div class="chart-wrapper">
              <canvas id="userGrowthChart"></canvas>
            </div>
          </div>
          <div class="chart-card">
            <h3>Order Status Breakdown</h3>
            <div class="chart-wrapper">
              <canvas id="allocationPieChart"></canvas>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="footer-container"></div>
    <script>
      loadComponent("footer.html", "footer-container");
    </script>

    <script>
      // ============================================================
      // CONFIG
      // ============================================================
      // Adjust this if your backend runs elsewhere (e.g. deployed URL).
      const API_BASE_URL = "https://e-commerce-shopping-website-swamini.onrender.com/api";

      // Auth token is expected to be stored under this key after login,
      // matching the `token` field returned by POST /api/auth/login.
      // This is the ONLY thing kept in localStorage — it's a standard,
      // short-lived credential, not application data. Every other value
      // on this page (users, orders, revenue, stats) is now fetched live
      // from the database on every load — nothing is cached in localStorage.
      const TOKEN_KEY = "buybloom_token";

      function getToken() {
        return localStorage.getItem(TOKEN_KEY);
      }

      function authHeaders() {
        const token = getToken();
        return token ? {Authorization: `Bearer ${token}`} : {};
      }

      async function apiGet(path) {
        const res = await fetch(`${API_BASE_URL}${path}`, {
          method: "GET",
          headers: {"Content-Type": "application/json", ...authHeaders()},
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.success === false) {
          const err = new Error(
            data.message || `Request failed (${res.status})`,
          );
          err.status = res.status;
          throw err;
        }
        return data;
      }

      // ---- Sidebar active-state fix ----
      (function highlightActiveSidebarLink() {
        const currentPage =
          window.location.pathname.split("/").pop() || "exadmidashbord.html";
        document
          .querySelectorAll(".sidebar-menu a[href]")
          .forEach(function (link) {
            const linkPage = link.getAttribute("href");
            if (linkPage === currentPage) {
              link.classList.add("active");
            } else {
              link.classList.remove("active");
            }
          });
      })();

      let growthChartInstance = null;
      let pieChartInstance = null;
      let currentTimeframe = "daily";

      // Raw data pulled once from the backend; timeframe switches just
      // re-slice/re-bucket this in memory instead of re-fetching.
      let rawUsers = []; // from GET /api/admin/users
      let rawOrders = []; // from GET /api/admin/orders
      let baseStats = {
        totalUsers: 0,
        totalProducts: 0,
        totalOrders: 0,
        totalRevenue: 0,
      };

      function showError(message) {
        const el = document.getElementById("dashboard-error");
        el.textContent = message;
        el.style.display = "block";
      }

      function formatCurrency(n) {
        return `$${Number(n || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      }

      // Returns a cutoff Date for the given timeframe window.
      function windowStart(mode) {
        const now = new Date();
        if (mode === "daily") {
          const d = new Date(now);
          d.setDate(d.getDate() - 7);
          return d;
        }
        if (mode === "weekly") {
          const d = new Date(now);
          d.setDate(d.getDate() - 7 * 8);
          return d;
        }
        // monthly: last 6 months
        const d = new Date(now);
        d.setMonth(d.getMonth() - 6);
        return d;
      }

      function bucketKey(date, mode) {
        const d = new Date(date);
        if (mode === "daily") {
          return d.toLocaleDateString(undefined, {
            month: "short",
            day: "numeric",
          });
        }
        if (mode === "weekly") {
          const weekStart = new Date(d);
          weekStart.setDate(d.getDate() - d.getDay());
          return `Wk of ${weekStart.toLocaleDateString(undefined, {month: "short", day: "numeric"})}`;
        }
        return d.toLocaleDateString(undefined, {
          month: "short",
          year: "2-digit",
        });
      }

      function buildBucketLabels(mode) {
        const labels = [];
        const now = new Date();
        if (mode === "daily") {
          for (let i = 6; i >= 0; i--) {
            const d = new Date(now);
            d.setDate(d.getDate() - i);
            labels.push(bucketKey(d, mode));
          }
        } else if (mode === "weekly") {
          for (let i = 7; i >= 0; i--) {
            const d = new Date(now);
            d.setDate(d.getDate() - i * 7);
            labels.push(bucketKey(d, mode));
          }
        } else {
          for (let i = 5; i >= 0; i--) {
            const d = new Date(now);
            d.setMonth(d.getMonth() - i);
            labels.push(bucketKey(d, mode));
          }
        }
        // de-dupe while preserving order (weekly/monthly bucketing can collide)
        return [...new Set(labels)];
      }

      function computeMetricsForTimeframe(mode) {
        const start = windowStart(mode);

        const usersInWindow = rawUsers.filter(
          (u) => new Date(u.createdAt) >= start,
        );
        const ordersInWindow = rawOrders.filter(
          (o) => new Date(o.createdAt) >= start,
        );

        // Active Users: no "last active" field exists in the User schema,
        // so this is the best real proxy available — distinct users who
        // have placed at least one order (all-time, not just this window).
        const activeUserIds = new Set(
          rawOrders.map((o) => (o.user && o.user._id) || o.user),
        );
        const activeUsers = activeUserIds.size;

        const pendingOrders = ordersInWindow.filter(
          (o) => o.status === "Pending",
        ).length;
        const revenueInWindow = ordersInWindow.reduce(
          (sum, o) => sum + (o.totalPrice || 0),
          0,
        );

        // ---- User growth chart: cumulative registered users, bucketed ----
        const labels = buildBucketLabels(mode);
        const countsByBucket = {};
        usersInWindow.forEach((u) => {
          const key = bucketKey(u.createdAt, mode);
          countsByBucket[key] = (countsByBucket[key] || 0) + 1;
        });
        // Users registered before the window count toward the starting total
        const usersBeforeWindow = rawUsers.filter(
          (u) => new Date(u.createdAt) < start,
        ).length;
        let running = usersBeforeWindow;
        const growthData = labels.map((l) => {
          running += countsByBucket[l] || 0;
          return running;
        });

        // ---- Order status breakdown (pie) ----
        const statusCounts = {
          Pending: 0,
          "In Progress": 0,
          Delivered: 0,
          Cancelled: 0,
        };
        ordersInWindow.forEach((o) => {
          if (o.status === "Pending") statusCounts.Pending++;
          else if (o.status === "Paid" || o.status === "Shipped")
            statusCounts["In Progress"]++;
          else if (o.status === "Delivered") statusCounts.Delivered++;
          else if (o.status === "Cancelled") statusCounts.Cancelled++;
        });

        return {
          totalUsers: baseStats.totalUsers,
          activeUsers,
          totalOrders: ordersInWindow.length,
          revenue: revenueInWindow,
          pendingOrders,
          growthLabels: labels,
          growthData,
          pieLabels: Object.keys(statusCounts),
          pieData: Object.values(statusCounts),
        };
      }

      function renderTimeframe(mode) {
        currentTimeframe = mode;
        document
          .querySelectorAll(".timeframe-filters .filter-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.getElementById(`btn-${mode}`).classList.add("active");

        const m = computeMetricsForTimeframe(mode);

        document.getElementById("txt-total-users").textContent =
          baseStats.totalUsers.toLocaleString();
        document.getElementById("txt-active-users").textContent =
          m.activeUsers.toLocaleString();
        document.getElementById("txt-total-orders").textContent =
          m.totalOrders.toLocaleString();
        document.getElementById("txt-revenue").textContent = formatCurrency(
          m.revenue,
        );
        document.getElementById("txt-pending").textContent =
          m.pendingOrders.toLocaleString();

        growthChartInstance.data.labels = m.growthLabels;
        growthChartInstance.data.datasets[0].data = m.growthData;
        growthChartInstance.update();

        pieChartInstance.data.labels = m.pieLabels;
        pieChartInstance.data.datasets[0].data = m.pieData;
        pieChartInstance.update();
      }

      function updateTimeframe(mode) {
        renderTimeframe(mode);
      }

      function initCharts() {
        const ctxGrowth = document
          .getElementById("userGrowthChart")
          .getContext("2d");
        growthChartInstance = new Chart(ctxGrowth, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Registered Users",
                data: [],
                borderColor: "#3498db",
                backgroundColor: "rgba(52, 152, 219, 0.1)",
                borderWidth: 2,
                fill: true,
                tension: 0.3,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {legend: {display: false}},
          },
        });

        const ctxPie = document
          .getElementById("allocationPieChart")
          .getContext("2d");
        pieChartInstance = new Chart(ctxPie, {
          type: "pie",
          data: {
            labels: [],
            datasets: [
              {
                data: [],
                backgroundColor: ["#e74c3c", "#f1c40f", "#2ecc71", "#7f8c8d"],
                borderWidth: 1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {legend: {position: "bottom"}},
          },
        });
      }

      function handleLogout() {
        if (confirm("Logout from the Admin Panel?")) {
          localStorage.removeItem(TOKEN_KEY);
          window.location.href = "login.html";
        }
      }

      async function loadDashboard() {
        if (!getToken()) {
          window.location.href = "login.html";
          return;
        }

        initCharts();

        try {
          const [statsRes, usersRes, ordersRes] = await Promise.all([
            apiGet("/admin/dashboard"),
            apiGet("/admin/users"),
            apiGet("/admin/orders"),
          ]);

          baseStats = {
            totalUsers: statsRes.totalUsers || 0,
            totalProducts: statsRes.totalProducts || 0,
            totalOrders: statsRes.totalOrders || 0,
            totalRevenue: statsRes.totalRevenue || 0,
          };
          rawUsers = usersRes.users || [];
          rawOrders = ordersRes.orders || [];

          renderTimeframe(currentTimeframe);
        } catch (err) {
          if (err.status === 401 || err.status === 403) {
            showError(
              "Your session isn't authorized as admin. Please log in with an admin account.",
            );
          } else {
            showError(`Couldn't load dashboard data: ${err.message}`);
          }
          document
            .querySelectorAll(".timeframe-filters .filter-btn")
            .forEach((btn) => (btn.disabled = true));
        }
      }

      window.onload = function () {
        loadDashboard();
      };
    </script>
  </body>
</html>
