<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUYBLOOM | CLOTHING STORE</title>
    <link
      rel="icon"
      href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo"
      type="image/gif"
      sizes="16x16"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato&display=swap"
      rel="stylesheet"
    />
    <script src="src/assets/js/jQuery3.4.1.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Lato", sans-serif;
        display: flex;
        flex-direction: column;
      }

      #header-container {
        width: 100%;
        order: -1;
      }
      #footer-container {
        width: 100%;
        order: 1;
      }

      #main-clothing-container {
        flex: 1;
        max-width: 1200px;
        width: 100%;
        margin: 40px auto;
        padding: 0 20px;
        box-sizing: border-box;
      }

      .page-title {
        text-align: center;
        font-size: 28px;
        letter-spacing: 1px;
        margin-bottom: 30px;
        text-transform: uppercase;
      }

      .filter-tabs {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 40px;
      }

      .filter-btn {
        padding: 10px 25px;
        font-size: 16px;
        font-family: "Lato", sans-serif;
        font-weight: bold;
        background-color: #f4f4f4;
        border: 1px solid #ddd;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background-color: #333;
        color: #fff;
        border-color: #333;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
      }

      .product-card {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        border: 1px solid #eee;
        cursor: pointer;
        position: relative;
      }

      .product-card:hover {
        transform: translateY(-5px);
      }

      .image-wrapper {
        width: 100%;
        height: 320px;
        background-color: #f9f9f9;
        overflow: hidden;
      }

      .image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .product-details {
        padding: 15px;
        text-align: center;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-bottom: 60px;
      }

      .brand-name {
        font-size: 12px;
        text-transform: uppercase;
        color: #888;
        letter-spacing: 1px;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .product-name {
        font-size: 16px;
        color: #333;
        margin: 0 0 10px 0;
        font-weight: normal;
      }

      .product-price {
        font-size: 18px;
        font-weight: bold;
        color: #27ae60;
      }

      .card-action-container {
        display: flex;
        gap: 8px;
        position: absolute;
        bottom: 15px;
        left: 15px;
        right: 15px;
        z-index: 10;
      }

      .btn-card-action {
        flex: 1;
        padding: 8px 10px;
        font-size: 12px;
        font-family: "Lato", sans-serif;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
        text-align: center;
      }

      .btn-card-action:active {
        transform: scale(0.96);
      }

      .btn-card-cart {
        background-color: #f39c12;
        color: #fff;
      }
      .btn-card-cart:hover {
        background-color: #e67e22;
      }
      .btn-card-buy {
        background-color: #2c3e50;
        color: #fff;
      }
      .btn-card-buy:hover {
        background-color: #1a252f;
      }

      .product-modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background-color: #fff;
        padding: 30px;
        border-radius: 12px;
        max-width: 500px;
        width: 90%;
        box-sizing: border-box;
        position: relative;
        text-align: center;
        animation: fadeIn 0.3s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .close-modal {
        position: absolute;
        right: 20px;
        top: 15px;
        font-size: 28px;
        font-weight: bold;
        color: #aaa;
        cursor: pointer;
      }

      .close-modal:hover {
        color: #333;
      }
      .modal-img {
        width: 100%;
        max-height: 300px;
        object-fit: contain;
        border-radius: 6px;
        margin-bottom: 15px;
      }
      .modal-brand {
        font-size: 14px;
        text-transform: uppercase;
        color: #888;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .modal-title {
        font-size: 20px;
        color: #333;
        margin: 0 0 10px 0;
      }
      .modal-price {
        font-size: 22px;
        font-weight: bold;
        color: #27ae60;
        margin-bottom: 25px;
      }
      .modal-action-btns {
        display: flex;
        gap: 15px;
        justify-content: center;
      }

      .btn-action {
        flex: 1;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .btn-add-cart {
        background-color: #f39c12;
        color: #fff;
      }
      .btn-add-cart:hover {
        background-color: #e67e22;
      }
      .btn-buy-now {
        background-color: #2c3e50;
        color: #fff;
      }
      .btn-buy-now:hover {
        background-color: #1a252f;
      }

      .loading-msg,
      .empty-msg {
        text-align: center;
        font-size: 16px;
        color: #888;
        grid-column: 1 / -1;
        padding: 40px 0;
      }
    </style>

    <script>
      function loadComponent(url, elementId) {
        var req = new XMLHttpRequest();
        req.open("GET", url, false);
        req.send(null);
        document.getElementById(elementId).innerHTML = req.responseText;
      }
    </script>
  </head>
  <body>
    <div id="header-container"></div>

    <main id="main-clothing-container">
      <h1 class="page-title">Clothing Collection</h1>

      <div class="filter-tabs">
        <button class="filter-btn active" onclick="filterCategory('all', this)"
          >All Clothing</button
        >
        <button class="filter-btn" onclick="filterCategory('men', this)"
          >Men</button
        >
        <button class="filter-btn" onclick="filterCategory('women', this)"
          >Women</button
        >
      </div>

      <div class="products-grid" id="clothingGrid">
        <div class="loading-msg" id="loadingMsg">Loading products...</div>
      </div>
    </main>

    <div
      class="product-modal"
      id="productModal"
      onclick="closeProductModal(event)"
    >
      <div class="modal-content" onclick="event.stopPropagation()">
        <span
          class="close-modal"
          onclick="
            document.getElementById('productModal').style.display = 'none'
          "
          >×</span
        >
        <img class="modal-img" id="modalImg" src="" alt="" />
        <div class="modal-brand" id="modalBrand"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-action-btns">
          <button class="btn-action btn-add-cart" id="modalCartActionBtn"
            >Add to Cart</button
          >
          <button class="btn-action btn-buy-now" id="modalBuyActionBtn"
            >Buy Now</button
          >
        </div>
      </div>
    </div>

    <div id="footer-container"></div>

    <script>
      const API_BASE = "http://localhost:5000/api"; // update to your deployed backend URL
      const token = localStorage.getItem("buybloom_token"); // auth token only, not app data

      loadComponent("header.html", "header-container");
      loadComponent("footer.html", "footer-container");

      let allProducts = []; // cache fetched products for client-side filtering

      // ---- Fetch clothing products from backend ----
      async function fetchClothingProducts() {
        try {
          const res = await fetch(`${API_BASE}/products?type=clothing`);
          const data = await res.json();

          if (!data.success)
            throw new Error(data.message || "Failed to load products");

          allProducts = data.products;
          renderProducts(allProducts);
        } catch (err) {
          console.error("Failed to fetch products:", err);
          document.getElementById("clothingGrid").innerHTML =
            `<div class="empty-msg">Could not load products. Please try again later.</div>`;
        }
      }

      // ---- Render product cards from backend data ----
      function renderProducts(products) {
        const grid = document.getElementById("clothingGrid");
        grid.innerHTML = "";

        if (!products.length) {
          grid.innerHTML = `<div class="empty-msg">No products found.</div>`;
          return;
        }

        products.forEach((product) => {
          // category.name is expected to hold "Men" / "Women" (populated Category doc)
          const genderCategory =
            product.category && product.category.name
              ? product.category.name.toLowerCase()
              : "";

          const card = document.createElement("div");
          card.className = "product-card";
          card.setAttribute("data-category", genderCategory);
          card.setAttribute("data-id", product._id);
          card.onclick = () => openProductModal(product);

          card.innerHTML = `
                    <div class="image-wrapper"><img src="${product.image}" alt="${product.name}"></div>
                    <div class="product-details">
                        <div>
                            <div class="brand-name">${product.brand}</div>
                            <h3 class="product-name">${product.name}</h3>
                        </div>
                        <div class="product-price">₹${product.price.toLocaleString("en-IN")}</div>
                    </div>
                `;

          const actionRow = document.createElement("div");
          actionRow.className = "card-action-container";

          const cartBtn = document.createElement("button");
          cartBtn.className = "btn-card-action btn-card-cart";
          cartBtn.innerHTML = '<i class="fas fa-shopping-cart"></i> Cart';
          cartBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            executeAddtoCart(product._id);
          });

          const buyBtn = document.createElement("button");
          buyBtn.className = "btn-card-action btn-card-buy";
          buyBtn.innerText = "Buy Now";
          buyBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            executeBuyNowDirect(product._id);
          });

          actionRow.appendChild(cartBtn);
          actionRow.appendChild(buyBtn);
          card.appendChild(actionRow);

          grid.appendChild(card);
        });
      }

      function filterCategory(category, buttonElement) {
        const buttons = document.querySelectorAll(".filter-btn");
        buttons.forEach((btn) => btn.classList.remove("active"));
        buttonElement.classList.add("active");

        const cards = document.querySelectorAll(".product-card");
        cards.forEach((card) => {
          if (
            category === "all" ||
            card.getAttribute("data-category") === category
          ) {
            card.style.display = "flex";
          } else {
            card.style.display = "none";
          }
        });
      }

      // ---- Add to cart via backend API ----
      async function executeAddtoCart(productId) {
        if (!token) {
          alert("Please log in to add items to your cart.");
          window.location.href = "login.html";
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/cart`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({productId, quantity: 1}),
          });
          const data = await res.json();

          if (!data.success) throw new Error(data.message);

          alert("Item successfully added to cart!");
        } catch (err) {
          console.error("Add to cart failed:", err);
          alert(err.message || "Failed to add item to cart.");
        }
      }

      // ---- Buy Now: add to cart then go straight to checkout ----
      async function executeBuyNowDirect(productId) {
        if (!token) {
          alert("Please log in to continue.");
          window.location.href = "login.html";
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/cart`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({productId, quantity: 1}),
          });
          const data = await res.json();

          if (!data.success) throw new Error(data.message);

          window.location.href = "checkout.html";
        } catch (err) {
          console.error("Buy now failed:", err);
          alert(err.message || "Failed to proceed to checkout.");
        }
      }

      function openProductModal(product) {
        document.getElementById("modalImg").src = product.image;
        document.getElementById("modalBrand").textContent = product.brand;
        document.getElementById("modalTitle").textContent = product.name;
        document.getElementById("modalPrice").textContent =
          `₹${product.price.toLocaleString("en-IN")}`;

        document.getElementById("modalCartActionBtn").onclick = function () {
          executeAddtoCart(product._id);
        };
        document.getElementById("modalBuyActionBtn").onclick = function () {
          executeBuyNowDirect(product._id);
        };

        document.getElementById("productModal").style.display = "flex";
      }

      function closeProductModal(event) {
        if (event.target.id === "productModal") {
          document.getElementById("productModal").style.display = "none";
        }
      }

      // ---- Show logged-in user's name from backend profile, not localStorage ----
      async function loadUserGreeting() {
        if (!token) return;

        try {
          const res = await fetch(`${API_BASE}/auth/profile`, {
            headers: {Authorization: `Bearer ${token}`},
          });
          const data = await res.json();
          if (!data.success || !data.user) return;

          const loginLink = document.querySelector(
            '#header-container a[href*="login.html"]',
          );
          if (loginLink) {
            loginLink.textContent = "Hi, " + data.user.name;
            loginLink.href = "#";
          }
        } catch (err) {
          console.error("Failed to load user profile:", err);
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        fetchClothingProducts();
        loadUserGreeting();
      });
    </script>
  </body>
</html>
